# ─── CA-managed reverse proxy ───────────────────────────
# Each app gets its own file in conf.d/apps/
# Reload: sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Will be updated when domain is configured
    server_name _;

    # Increase buffers for proxying
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Include per-app proxy configs
    include /etc/nginx/conf.d/apps/*.conf;

    # Default fallback — apps index page
    location / {
        root /opt/apps/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
